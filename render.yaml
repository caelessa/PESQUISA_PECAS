services:
  - type: web
    name: consulta-autopecas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --timeout 180 app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: BALCAO_USER
        value: vendedor
      - key: BALCAO_PASSWORD
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: consulta-autopecas-db
          property: connectionString

databases:
  - name: consulta-autopecas-db
    plan: free
    databaseName: consulta_autopecas
    user: consulta_autopecas
